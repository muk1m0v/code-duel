<!-- room.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Баттл</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="room">
  <div id="topBar">
    <div id="playersInfo">
      <span id="myName"></span> vs <span id="opponentName">Ожидание...</span>
    </div>
    <button id="submitBtn">Готово</button>
  </div>
  <div id="mainArea">
    <div id="leftPanel">
      <div class="editor-container">
        <textarea id="codeEditor" placeholder="Введите HTML/CSS код..."></textarea>
      </div>
      <div class="preview-container">
        <iframe id="previewFrame" sandbox="allow-same-origin"></iframe>
      </div>
    </div>
    <div id="rightPanel">
      <h3>Задание</h3>
      <iframe id="taskFrame" src="/tasks/task1.html" sandbox="allow-same-origin"></iframe>
    </div>
  </div>
  <div id="overlay" style="display:none;">
    <div id="overlayMsg"></div>
    <button id="okBtn">OK</button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
