<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Code Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>HTML / CSS Battle</h1>
  <div class="menu">
    <div class="box_1">
      <h3>Создать Комнату</h3>
      <input type="text" id="playerName" placeholder="Ваше имя" maxlength="15" autocomplete="off" />
      <p id="nameError" style="color:#e74c3c; display:none; font-size:14px;">Имя должно содержать буквы, цифры, пробел, _ или -</p>
      <select id="timeSelect">
        <option value="5">5 минут</option>
        <option value="10" selected>10 минут</option>
        <option value="15">15 минут</option>
        <option value="20">20 минут</option>
        <option value="25">25 минут</option>
        <option value="30">30 минут</option>
      </select>
      <button id="createRoomBtn">Создать комнату</button>
    </div>
    <div class="box_2">
      <h3>Присоединиться</h3>
      <input type="text" id="joinCodeInput" placeholder="Введите код комнаты" maxlength="5" autocomplete="off" />
      <button id="joinRoomBtn">Присоединиться</button>
      <p id="errorMsg" style="color:#e74c3c;"></p>
    </div>
  </div>
  <p id="foot">Power by mukimov</p>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
