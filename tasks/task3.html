<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f0f1a;
      margin: 0;
    }
    .neon-btn {
      background: none;
      border: 2px solid #c77dff;
      color: #c77dff;
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
      box-shadow: 0 0 10px #c77dff;
    }
    .neon-btn:hover {
      background: #c77dff;
      color: #0f0f1a;
      box-shadow: 0 0 20px #c77dff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <button class="neon-btn">Наведи на меня</button>
</body>
</html>
