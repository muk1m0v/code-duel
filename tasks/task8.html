<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #0f0f1a;
    margin: 0;
    font-family: 'Georgia', serif;
  }
  .quote {
    max-width: 400px;
    padding: 20px;
    border-left: 5px solid #c77dff;
    background: #1a1a2e;
    color: white;
    font-style: italic;
    text-align: center;
  }
  .quote p {
    margin: 0;
  }
  .author {
    margin-top: 10px;
    font-style: normal;
    color: #c77dff;
  }
</style>
</head>
<body>
  <div class="quote">
    <p>Код — это поэзия.</p>
    <div class="author">— Программист</div>
  </div>
</body>
</html>
