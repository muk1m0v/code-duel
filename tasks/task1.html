<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a2e;
      margin: 0;
    }
    .square {
      width: 300px;
      height: 300px;
      border: 4px solid #c77dff;
      box-shadow: 0 0 20px #c77dff, 0 0 40px #c77dff;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: transparent;
      border-radius: 10px;
    }
    .ball {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 30% 30%, #fff, #c77dff);
      border-radius: 50%;
      box-shadow: 0 0 10px #c77dff;
    }
  </style>
</head>
<body>
  <div class="square">
    <div class="ball"></div>
    <div class="ball"></div>
    <div class="ball"></div>
  </div>
</body>
</html>
