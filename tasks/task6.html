<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a2e;
    font-family: sans-serif;
    margin: 0;
  }
  form {
    background: #2a2a3e;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }
  input {
    padding: 10px;
    margin: 10px;
    border: none;
    border-radius: 5px;
  }
  button {
    background: #c77dff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <form>
    <input type="text" placeholder="Ваше имя">
    <button>Отправить</button>
  </form>
</body>
</html>
