<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a2e;
      margin: 0;
    }
    .card {
      width: 250px;
      padding: 20px;
      background: linear-gradient(135deg, #c77dff, #9b59b6);
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      color: white;
      font-family: sans-serif;
    }
    .card h2 {
      margin: 0 0 10px;
    }
    .card p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Привет, мир!</h2>
    <p>Это простая карточка с градиентом.</p>
  </div>
</body>
</html>
