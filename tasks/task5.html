<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    height: 100vh;
    background: #0f0f1a;
    margin: 0;
  }
  .circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
  }
  .red { background: #ff4757; }
  .green { background: #2ed573; }
  .blue { background: #1e90ff; }
</style>
</head>
<body>
  <div class="circle red"></div>
  <div class="circle green"></div>
  <div class="circle blue"></div>
</body>
</html>
