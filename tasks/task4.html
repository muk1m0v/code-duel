<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a2e;
    margin: 0;
    font-family: sans-serif;
  }
  .box {
    width: 200px;
    height: 200px;
    background: #c77dff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px #c77dff;
  }
</style>
</head>
<body>
  <div class="box">Привет!</div>
</body>
</html>
